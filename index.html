<!DOCTYPE html>
<html class="dark" lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Krishna Kant — Portfolio</title>
  <meta name="description" content="Krishna Kant — AI/ML Engineer, full-stack builder, agent systems, researcher, and explorer."/>
  <meta name="theme-color" content="#000000"/>
  <script>
    try {
      if (localStorage.getItem("kk-theme") === "light") {
        document.documentElement.classList.remove("dark");
        document.documentElement.classList.add("light");
      }
    } catch (e) {}
  </script>
  <link rel="icon" href="https://avatars.githubusercontent.com/u/174959155?v=4"/>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;700;800&amp;family=Geist:wght@400;500;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="css/styles.css"/>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            surface: "#000000",
            "on-surface": "#ffffff",
            "on-surface-variant": "rgba(255, 255, 255, 0.7)",
            primary: "#ffffff",
            secondary: "rgba(255, 255, 255, 0.6)",
            "surface-container": "rgba(255, 255, 255, 0.05)",
          },
          spacing: {
            "container-max": "1000px",
            "margin-mobile": "16px",
            "margin-desktop": "48px",
          },
          fontFamily: {
            "body-md": ["Geist", "sans-serif"],
            "headline-lg": ["Sora", "sans-serif"],
            "label-sm": ["JetBrains Mono", "monospace"],
            "display-lg": ["Sora", "sans-serif"],
            "headline-lg-mobile": ["Sora", "sans-serif"],
          },
          fontSize: {
            "body-md": ["16px", { lineHeight: "1.6", fontWeight: "400" }],
            "headline-lg": ["40px", { lineHeight: "1.2", fontWeight: "700" }],
            "label-sm": ["12px", { lineHeight: "1", letterSpacing: "0.05em", fontWeight: "500" }],
            "display-lg": ["64px", { lineHeight: "1.1", letterSpacing: "-0.02em", fontWeight: "800" }],
            "headline-lg-mobile": ["32px", { lineHeight: "1.2", fontWeight: "700" }],
          },
          backgroundImage: {
            "cosmic-dust": "radial-gradient(circle at center, rgba(255,255,255,0.03) 0%, transparent 70%)",
          },
        },
      },
    };
  </script>
</head>
<body class="antialiased min-h-screen relative font-body-md text-body-md bg-black">
  <div class="star-texture no-print"></div>

  <nav class="no-print glass-nav hidden md:flex justify-between items-center px-6 py-3 max-w-container-max mx-auto fixed top-4 left-4 right-4 w-auto z-50 rounded-full gap-4">
    <a href="#hero" class="js-brand font-headline-lg text-xl text-white tracking-tight shrink-0">Krishna</a>
    <div class="flex items-center gap-6 lg:gap-8">
      <a class="nav-link text-white/70 hover:text-white transition-colors pb-1" href="#about">About</a>
      <a class="nav-link text-white/70 hover:text-white transition-colors pb-1" href="#work">Work</a>
      <a class="nav-link text-white/70 hover:text-white transition-colors pb-1" href="#projects">Projects</a>
      <a class="nav-link text-white/70 hover:text-white transition-colors pb-1" href="#achievements">Achievements</a>
      <a class="nav-link text-white/70 hover:text-white transition-colors pb-1" href="#education">Education</a>
    </div>
    <div class="flex items-center gap-2 shrink-0">
      <button type="button" class="theme-toggle" data-theme-toggle aria-label="Switch to light theme">
        <span class="theme-orb" aria-hidden="true"></span>
      </button>
      <a href="https://drive.google.com/file/d/1raukZqDprmAOrl2zKknZYJTlN6BPOrod/view?usp=drive_link" target="_blank" rel="noopener noreferrer" class="js-resume-view border border-white/30 text-white px-4 py-2 rounded-full text-sm hover:bg-white/10 transition-colors">Resume</a>
      <button type="button" data-open-contact class="cta-btn bg-white text-black px-5 py-2 rounded-full font-bold hover:bg-white/90 scale-95 active:scale-90 transition-transform">Contact</button>
    </div>
  </nav>

  <nav class="no-print md:hidden fixed bottom-8 left-1/2 -translate-x-1/2 rounded-full px-6 py-3 z-50 bg-black/60 backdrop-blur-2xl border border-white/20 shadow-[0_0_20px_rgba(255,255,255,0.05)] flex items-center gap-6">
    <a class="flex flex-col items-center justify-center text-white hover:scale-110 active:scale-95 transition-all" href="#about">
      <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">person</span>
      <span class="font-label-sm text-label-sm mt-1">About</span>
    </a>
    <a class="flex flex-col items-center justify-center text-white/70 hover:text-white hover:scale-110 active:scale-95 transition-all" href="#work">
      <span class="material-symbols-outlined">work</span>
      <span class="font-label-sm text-label-sm mt-1">Work</span>
    </a>
    <a class="flex flex-col items-center justify-center text-white/70 hover:text-white hover:scale-110 active:scale-95 transition-all" href="#projects">
      <span class="material-symbols-outlined">code</span>
      <span class="font-label-sm text-label-sm mt-1">Projects</span>
    </a>
    <button type="button" id="mobile-menu-btn" class="flex flex-col items-center justify-center text-white/70 hover:text-white hover:scale-110 active:scale-95 transition-all">
      <span class="material-symbols-outlined">apps</span>
      <span class="font-label-sm text-label-sm mt-1">Menu</span>
    </button>
  </nav>

  <div id="mobile-menu" class="no-print hidden md:hidden fixed inset-0 z-40 bg-black/80 backdrop-blur-xl">
    <div class="flex flex-col items-center justify-center h-full gap-8 text-xl">
      <a href="#about" class="mobile-menu-link">About</a>
      <a href="#work" class="mobile-menu-link">Work</a>
      <a href="#projects" class="mobile-menu-link">Projects</a>
      <a href="#achievements" class="mobile-menu-link">Achievements</a>
      <a href="#education" class="mobile-menu-link">Education</a>
      <a href="https://drive.google.com/file/d/1raukZqDprmAOrl2zKknZYJTlN6BPOrod/view?usp=drive_link" target="_blank" rel="noopener noreferrer" class="js-resume-view text-white/80">Resume</a>
      <button type="button" class="theme-toggle" data-theme-toggle aria-label="Switch to light theme">
        <span class="theme-orb" aria-hidden="true"></span>
      </button>
      <button type="button" data-open-contact class="cta-btn bg-white text-black px-8 py-3 rounded-full font-bold">Contact</button>
    </div>
  </div>

  <div id="print-root">
    <main class="glass-shell mt-28 mb-24 px-5 py-10 md:px-12 md:py-14 max-w-container-max mx-auto space-y-20 relative z-10 rounded-[2rem]">
      <section class="flex flex-col md:flex-row items-center gap-10 md:gap-12" id="hero"></section>
      <section class="space-y-8 relative" id="about"></section>
      <section class="space-y-8 relative" id="work"></section>
      <section class="space-y-8" id="skills"></section>
      <section class="space-y-8" id="projects"></section>
      <section class="space-y-8" id="achievements"></section>
      <section class="space-y-8" id="education"></section>
    </main>

    <footer class="glass-panel w-full py-8 mb-28 md:mb-10 flex flex-col md:flex-row justify-between items-center px-6 md:px-10 max-w-container-max mx-auto gap-4 rounded-3xl">
      <div class="js-copy font-headline-lg-mobile text-white/60 text-sm"></div>
      <div class="js-links flex gap-6 flex-wrap justify-center"></div>
    </footer>
  </div>

  <dialog id="contact-modal" class="no-print glass-modal text-white rounded-3xl p-0 w-[min(92vw,440px)]">
    <form method="dialog" class="p-8 space-y-6">
      <div class="flex items-start justify-between gap-4">
        <div>
          <h2 class="font-headline-lg text-2xl">Contact</h2>
          <p class="text-white/60 text-sm mt-1">Reach me by email or any of the links below.</p>
        </div>
        <button value="close" class="text-white/50 hover:text-white" aria-label="Close">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <div id="contact-body" class="space-y-3"></div>
    </form>
  </dialog>

  <div id="resume-sheet" aria-hidden="true"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="js/content.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
